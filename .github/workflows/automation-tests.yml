name: Automation Tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  api-test:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run API tests
        run: ./gradlew clean apiTest --rerun-tasks

      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: build/reports/cucumber/

  web-test:
    name: Web UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Web tests
        run: ./gradlew clean webTest --rerun-tasks

      - name: Upload Web reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          path: build/reports/cucumber/