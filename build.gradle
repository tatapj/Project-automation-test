plugins {
    id 'java'
}

group = 'com.automation'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'

    // Cucumber
    testImplementation 'io.cucumber:cucumber-java:7.18.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.0'

    // Selenium
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.20.0'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.8.0'

    // REST Assured
    testImplementation 'io.rest-assured:rest-assured:5.4.0'

    // JSON
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // Assertion
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()
}

tasks.register('apiTest', Test) {
    group = 'verification'
    description = 'Execute all Cucumber tests tagged with @api'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()

    include '**/ApiTestRunner.class'

    systemProperty 'cucumber.filter.tags', '@api'

    systemProperty 'cucumber.plugin',
            'pretty,html:build/reports/cucumber/api-report.html,json:build/reports/cucumber/api-report.json'

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

tasks.register('webTest', Test) {
    group = 'verification'
    description = 'Execute all Cucumber tests tagged with @web'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform()

    include '**/WebTestRunner.class'

    systemProperty 'cucumber.filter.tags', '@web'

    systemProperty 'cucumber.plugin',
            'pretty,html:build/reports/cucumber/web-report.html,json:build/reports/cucumber/web-report.json'

    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}